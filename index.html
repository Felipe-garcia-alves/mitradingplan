<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- o app já é em português: impede o tradutor do navegador de "traduzir" nomes e mensagens -->
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0e1217" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MiTrading" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- SEO / Social -->
    <title>Mi Trading Plan</title>
    <meta name="description" content="Plataforma profissional para traders — análise comportamental, disciplina e performance." />
    <meta property="og:title" content="Mi Trading Plan" />
    <meta property="og:description" content="Plataforma profissional para traders" />
    <meta property="og:image" content="/icons/icon-512.png" />

    <link rel="icon" type="image/png" href="/icons/icon-192.png" />

    <!-- Aparência salva (tema, fundo, cor dos cards, cards flutuando), aplicada antes da página aparecer.
         As cores da barra repetem as de FUNDOS em src/lib/tema.js -->
    <script>
      try {
        var h = document.documentElement;
        var t = localStorage.getItem("mtp-tema") === "light" ? "light" : "dark";
        var barra = { slate:"#0e1217", grafite:"#111214", marinho:"#0b1220", floresta:"#0b1813" };
        var f = localStorage.getItem("mtp-fundo");
        if (!barra[f]) f = "slate";
        var c = localStorage.getItem("mtp-cards");
        if (c === "grafite" || c === "azul") h.dataset.cards = c;
        h.dataset.theme = t;
        h.dataset.fundo = f;
        if (localStorage.getItem("mtp-flutuar") === "nao") h.dataset.flutuar = "nao";
        document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "light" ? "#eef2f0" : barra[f]);
      } catch (e) { document.documentElement.dataset.theme = "dark"; }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
